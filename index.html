<!DOCTYPE html>
<html lang="en" data-base="neutral">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TechAge Tracker</title>
  <meta name="description" content="Hardware age, warranty, receipts & valuations tracker" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="alternate icon" type="image/png" href="/icon-192.png" />

  <!-- iOS PWA / Home Screen Support -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TechTracker" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Antic&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script>

    (function () {
      try {
        const theme = localStorage.getItem('tech_tracker_theme');
        const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && supportDarkMode)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>

  <style>
    :root {
      background-color: #f8fafc;
    }

    .dark {
      background-color: #000000;
      color: #f4f4f5;
    }

    /* Prevent white border pop in dark mode.
       Must be inside @layer so Tailwind @layer utilities can override it. */
    @layer base {
      :where(.dark *) {
        border-color: #27272a;
        /* Zinc 800 */
      }
    }





    body {
      margin: 0;
      background-color: inherit;
    }


    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fade-out {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @keyframes zoom-in {
      from {
        transform: translate(-50%, -48%) scale(0.95);
        opacity: 0;
      }

      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    @keyframes zoom-out {
      from {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }

      to {
        transform: translate(-50%, -48%) scale(0.95);
        opacity: 0;
      }
    }

    .animate-in {
      animation-duration: 150ms;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      animation-fill-mode: forwards;
    }

    .data-\[state\=open\]\:animate-in[data-state="open"] {
      animation-name: fade-in;
    }

    .dialog-content-in[data-state="open"] {
      animation-name: zoom-in;
    }

    .data-\[state\=closed\]\:animate-out[data-state="closed"] {
      animation-name: fade-out;
    }

    .dialog-content-out[data-state="closed"] {
      animation-name: zoom-out;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react/": "https://esm.sh/react@^19.2.4/",
      "react": "https://esm.sh/react@^19.2.4",
      "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
      "lucide-react": "https://esm.sh/lucide-react@^0.564.0"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          console.log('[PWA] Service Worker registered with scope:', reg.scope);
        }).catch((err) => {
          console.warn('[PWA] Service Worker registration failed:', err);
        });
      });
    }
  </script>
</body>

</html>
